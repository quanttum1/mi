<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tomi lili mi</title>

    <style>

      @media {
        :root {
          --bg: #0f172a;
          --text: #d9d2cf;
          --muted: #9ca3af;
          --accent: #818cf8;
          --card: #111827;
          --border: #99928f;
        }
      }

      * {
        box-sizing: border-box;
      }

      @font-face {
        font-family: agaveNerd;
        src: url(/fonts/AgaveNerdFontMono-Regular.ttf);
      }

      @font-face {
        font-family: nasinNanpa;
        src: url(/fonts/nasin-nanpa-4.0.2-UCSUR.otf);
      }

      body {
        margin: 0;
        font-family: nasinNanpa, agaveNerd;
        font-size: 1.1rem;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }

      .container {
        max-width: 720px;
        margin: 0 auto;
        padding: 2rem 1.5rem;
      }

      header {
        margin-bottom: 2.5rem;
      }

      h1 {
        font-size: 2.2rem;
        margin: 0 0 0.3rem;
      }

      .subtitle {
        color: var(--muted);
        font-size: 1.1rem;
      }

      section {
        margin-top: 2.5rem;
      }

      h1 {
        margin-bottom: 0.75rem;
        border-bottom: 1px solid var(--border);
        padding-bottom: 0.25rem;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1rem;
        margin-bottom: 1rem;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      footer {
        margin-top: 3rem;
        font-size: 0.9rem;
        color: var(--muted);
        text-align: center;
      }

      header {
        font-size: 3rem;
        text-align: center;
        margin-bottom: 0.75rem;
        border-bottom: 1px solid var(--border);
        padding-bottom: 0.25rem;
      }

      .links a {
        margin-right: 1rem;
      }

      #heart {
        display: inline;
        height: 1em;
      }

      header > a {
        color: #f285aa;
      }

      h2 {
        margin: 0;
      }

      ul {
        margin-top: 0;
      }

      .button {
        width: 88px;
        height: 31px;
        box-shadow: 0.15em 0.15em 0 0 #000;
        image-rendering: pixelated;
        text-decoration: none;
        transition: transform 0.03s ease-in-out,
                    box-shadow 0.03s ease-in-out,
                    filter 0.03s ease-in-out;
      }

      .button:hover {
        /* filter: brightness(1.1); */
        /* scale: 1.1; */
        transform: translate(-0.15em, -0.15em);
        box-shadow: 0.3em 0.3em 0 0 #000;
      }

      .button:active {
        box-shadow: 0 0 0 0 #000;
        transform: translate(0.15em, 0.15em);
        /* filter: brightness(0.9); */
      }

      @media (max-width: 470px) {
        .button {
          width: 66px;
          height: 31px;
        }
      }

      @media (min-width: 600px) {
        .button {
          width: 110px;
          height: 38.75px;
        }
      }

      @media (min-width: 900px) {
        .button {
          width: 132px;
          height: 46.5px;
        }
      }

      @media (min-width: 1200px) {
        .button {
          width: 176px;
          height: 62px;
        }
      }
      @media (min-width: 1500px) {
        .button {
          width: 220px;
          height: 77.5px;
        }
      }

      @media (min-width: 1800px) {
        .button {
          width: 264px;
          height: 93px;
        }
      }

      #buttons {
        display: flex;
        justify-content: center;
        gap: 10px;
      }

      #sike {
        display: flex;
        justify-content: center;
      }
    </style>
  </head>
